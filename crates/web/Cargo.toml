[package]
name = "eden-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eden-formats = { path = "../formats" }
png.workspace = true
zip = { version = "7.2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
eden-engine = { path = "../engine" }
js-sys = "0.3"
log.workspace = true
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
winit.workspace = true
web-time.workspace = true
wgpu.workspace = true
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "File",
    "Blob",
    "console",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "MediaError",
    "Node",
    "Url",
    "Window",
] }
